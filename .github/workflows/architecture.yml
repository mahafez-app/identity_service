name: Architecture

on:
  push:
  pull_request:

jobs:
  architecture:
    uses: mahafez-app/mahafez_app/.github/workflows/architecture-reusable.yml@main
    with:
      target_repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
      target_ref: ${{ github.event.pull_request.head.sha || github.sha }}
      target_package: identity_service
